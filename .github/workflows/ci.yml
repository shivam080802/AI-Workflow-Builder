name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: awb, POSTGRES_PASSWORD: awb, POSTGRES_DB: awb}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U awb -d awb" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://awb:awb@localhost:5432/awb?schema=public
      REDIS_URL: redis://localhost:6379
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'yarn'}
      - run: yarn install --frozen-lockfile
      - run: yarn db:generate
      - run: yarn workspace @awb/db prisma migrate deploy
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
      - name: Integration smoke test
        run: |
          yarn turbo run dev --parallel > /tmp/awb-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4000/health
          yarn test:smoke
