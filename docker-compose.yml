services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: awb
      POSTGRES_PASSWORD: awb
      POSTGRES_DB: awb
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awb -d awb"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
